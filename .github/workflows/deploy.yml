name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build
        run: npm run build
        
      - name: Add CNAME and static route files
        run: |
          echo "gurmehar.ca" > dist/CNAME
          cp dist/index.html dist/404.html
          # GitHub Pages serves 404.html with an HTTP 404 status on direct
          # deep-link loads; real route dirs get a proper 200 for the SPA.
          for route in musebook experience projects contact; do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done
          # Nested SPA route: /musebook/join gets a proper 200 too.
          mkdir -p "dist/musebook/join"
          cp dist/index.html "dist/musebook/join/index.html"
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
